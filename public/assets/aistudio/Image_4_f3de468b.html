<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VividScout Onboarding</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#00D1C4',
              coral: '#FF5A5F',
              night: '#080B1E',
              midnight: '#0D132D',
              indigo: '#181C3F',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          boxShadow: {
            'glow-coral': '0 8px 30px -4px rgba(255, 90, 95, 0.55)',
            'glow-teal': '0 0 20px 2px rgba(0, 209, 196, 0.55)',
            'glass-card': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
          }
        }
      }
    };
  </script>
<!-- Custom Styles: Animations and Fine Glow Effects -->
<style data-purpose="custom-effects">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #050711;
    }
    
    /* Subtle float animations for badges */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(0.5deg); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(5px) rotate(-0.5deg); }
    }
    .badge-float-1 {
      animation: floatSlow 4.5s ease-in-out infinite;
    }
    .badge-float-2 {
      animation: floatReverse 5s ease-in-out infinite 0.6s;
    }
    .badge-float-3 {
      animation: floatSlow 5.2s ease-in-out infinite 1.2s;
    }
    
    /* Radial aura pulse behind 3D visual */
    @keyframes auraPulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    .aura-bg {
      animation: auraPulse 6s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 text-white antialiased selection:bg-brand-teal selection:text-black">
<!-- BEGIN: PhoneShell (390px mobile viewport simulated for Android/iOS frame) -->
<main class="relative w-full max-w-[390px] h-[844px] max-h-[100dvh] sm:max-h-[844px] overflow-hidden rounded-none sm:rounded-[44px] shadow-2xl flex flex-col justify-between border-0 sm:border-8 border-slate-900 bg-brand-night" data-purpose="mobile-viewport-container">
<!-- Fluid Multi-Color Ambient Mesh Background -->
<div aria-hidden="true" class="absolute inset-0 pointer-events-none overflow-hidden -z-10">
<div class="absolute -top-[15%] -left-[15%] w-[420px] h-[420px] rounded-full bg-gradient-to-br from-[#121E4E] via-[#0E4B5C] to-transparent blur-[70px] opacity-75"></div>
<div class="absolute top-[28%] -right-[20%] w-[360px] h-[360px] rounded-full bg-gradient-to-bl from-[#FF5A5F]/25 via-[#68195E]/35 to-transparent blur-[75px]"></div>
<div class="absolute -bottom-[10%] -left-[10%] w-[380px] h-[380px] rounded-full bg-gradient-to-tr from-[#00D1C4]/20 via-[#132A60]/40 to-transparent blur-[70px]"></div>
<!-- Subtle dot matrix / star dust atmosphere -->
<div class="absolute inset-0 opacity-[0.12] bg-[radial-gradient(#ffffff_1px,transparent_1px)] [background-size:18px_18px]"></div>
</div>
<!-- BEGIN: TopBarSection -->
<header class="w-full pt-2.5 px-6 pb-2 z-20 flex flex-col gap-2 shrink-0">
<!-- Android Status Bar -->
<div class="flex items-center justify-between text-xs font-semibold tracking-tight text-slate-300/80 px-1 select-none" data-purpose="system-status-bar">
<span>9:41</span>
<div class="flex items-center space-x-2">
<!-- Signal Icon -->
<svg class="w-3.5 h-3.5 fill-current opacity-90" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.57-.52 3.03-1.42 4.22L12 19.53l-5.58-3.31C5.52 15.03 5 13.57 5 12c0-3.87 3.13-7 7-7z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3.5 fill-current opacity-90" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.55 0 6.77 1.34 9.21 3.54L12 19.34 2.79 11.04C5.23 8.84 8.45 7.5 12 7.5z"></path>
</svg>
<!-- Battery Icon -->
<svg class="w-4 h-4 fill-current opacity-90" viewbox="0 0 24 24">
<path d="M17 5v14H7V5h10m1-2H6c-.55 0-1 .45-1 1v16c0 .55.45 1 1 1h12c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1zm-3-2H9v1h6V1z"></path>
</svg>
</div>
</div>
<!-- App Header Bar: Brand Logo & Skip Pill Button -->
<div class="flex items-center justify-between pt-1">
<!-- Logo -->
<div class="flex items-center space-x-2" data-purpose="app-branding">
<div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-teal to-brand-coral p-[1.5px] shadow-sm shadow-brand-teal/40">
<div class="w-full h-full bg-brand-midnight/90 backdrop-blur-md rounded-[10px] flex items-center justify-center">
<svg class="w-4 h-4 text-brand-teal" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"></path>
</svg>
</div>
</div>
<span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-300 bg-clip-text text-transparent">
            Vivid<span class="text-brand-teal">Scout</span>
</span>
</div>
<!-- Skip Button (Glassmorphic Pill) -->
<button aria-label="Skip onboarding intro" class="px-3.5 py-1 text-xs font-semibold tracking-wide text-slate-300 hover:text-white bg-white/10 hover:bg-white/15 border border-white/15 backdrop-blur-md rounded-full transition-all duration-200 active:scale-95" type="button">
          Skip
        </button>
</div>
<!-- Component 1: Kinetic Top Pagination Tracker -->
<div aria-label="Step progress tracker" class="flex items-center justify-center gap-1.5 pt-2" data-purpose="pagination-tracker">
<!-- Step 1: Active elongated glowing pill -->
<div class="h-[7px] w-[42px] rounded-full bg-gradient-to-r from-brand-teal to-[#36edd9] shadow-glow-teal transition-all"></div>
<!-- Step 2: Inactive dot -->
<div class="h-[7px] w-[10px] rounded-full bg-white/20 transition-all"></div>
<!-- Step 3: Inactive dot -->
<div class="h-[7px] w-[10px] rounded-full bg-white/20 transition-all"></div>
<!-- Step 4: Inactive dot -->
<div class="h-[7px] w-[10px] rounded-full bg-white/20 transition-all"></div>
</div>
</header>
<!-- END: TopBarSection -->
<!-- BEGIN: CentralVisualSection -->
<section class="relative flex-1 flex items-center justify-center px-4 -my-2" data-purpose="visual-stage">
<!-- Neon Ambient Aura Behind Compass -->
<div class="aura-bg absolute w-64 h-64 rounded-full bg-gradient-to-tr from-brand-teal/40 via-brand-coral/30 to-purple-600/30 blur-2xl -z-10"></div>
<!-- Glassmorphic Compass Visual Container -->
<div class="relative w-[286px] h-[286px] rounded-3xl p-1 bg-gradient-to-b from-white/15 via-white/5 to-transparent border border-white/15 backdrop-blur-sm shadow-glass-card flex items-center justify-center">
<!-- Subtle Inner Circular Compass Border -->
<div class="absolute inset-3 rounded-2xl border border-brand-teal/20 pointer-events-none"></div>
<!-- The Central 3D Floating Isometric Compass Graphic -->
<img alt="3D stylized isometric vibrant illustration of a glowing holographic brass and neon compass floating in mid-air with glowing neon map pins and cobblestones" class="w-full h-full object-contain filter drop-shadow-[0_12px_24px_rgba(0,0,0,0.5)] scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCUkP19XPfTTBVM81Cs-4RjLfyNWSvfDaKj8HOfTl9vbeeV-JR0nykr-TdAA7kLBBUVc0R0-oOyhR1FVqCf5jyrfh_aqnfwvKTy_wgovfbopdjjQeSuJ4Bm5oZe2sgUXrdjZ0CWypWzHLFlmhQbvXIEVhCxRtVuvk9Xzk59_ZSZNrLiMNLrG6j4lbWxmI-pxYkcoSCxKnoSLB9BqjinrnvtvYMo0oYWdvigLcGC4k5JyAhX3dDrQesI"/>
<!-- Floating Micro Chip Badge 1: Top Left -->
<div class="badge-float-1 absolute -top-2 -left-4 px-2.5 py-1.5 rounded-full bg-brand-midnight/80 border border-brand-teal/40 backdrop-blur-md shadow-lg flex items-center space-x-1.5">
<span class="w-2 h-2 rounded-full bg-brand-teal animate-ping"></span>
<span class="text-[11px] font-bold tracking-tight text-white flex items-center gap-1">
<span>⚡</span> Real-time radar
          </span>
</div>
<!-- Floating Micro Chip Badge 2: Right Middle -->
<div class="badge-float-2 absolute top-14 -right-5 px-2.5 py-1.5 rounded-full bg-brand-midnight/85 border border-brand-coral/40 backdrop-blur-md shadow-lg flex items-center space-x-1.5">
<span class="w-2 h-2 rounded-full bg-brand-coral"></span>
<span class="text-[11px] font-bold tracking-tight text-white flex items-center gap-1">
<span>📍</span> 10m radius
          </span>
</div>
<!-- Floating Micro Chip Badge 3: Bottom Left -->
<div class="badge-float-3 absolute -bottom-3 left-4 px-2.5 py-1.5 rounded-full bg-brand-midnight/85 border border-purple-400/40 backdrop-blur-md shadow-lg flex items-center space-x-1.5">
<span class="w-2 h-2 rounded-full bg-purple-400"></span>
<span class="text-[11px] font-bold tracking-tight text-white flex items-center gap-1">
<span>✨</span> Unbeaten paths
          </span>
</div>
</div>
</section>
<!-- END: CentralVisualSection -->
<!-- BEGIN: InformationAndActions -->
<section class="w-full px-6 pb-5 pt-1 z-20 flex flex-col space-y-4" data-purpose="content-and-cta">
<!-- Headline & Subtitle -->
<div class="text-center space-y-2">
<h1 class="text-3xl font-extrabold tracking-tight leading-tight text-white">
          Discover the <span class="bg-gradient-to-r from-brand-teal via-emerald-300 to-white bg-clip-text text-transparent">Unseen</span>
</h1>
<p class="text-xs sm:text-[13px] font-medium text-slate-300 leading-relaxed max-w-[320px] mx-auto opacity-95">
          Real-time secret spots, freshly baked tarts, and hidden alley shortcuts scouted by locals right around you.
        </p>
</div>
<!-- Category Filter Micro-Chips -->
<div class="flex items-center justify-center gap-2 pt-0.5" data-purpose="category-pills">
<!-- Chip 1: Sights -->
<div class="px-2.5 py-1 rounded-full bg-emerald-950/40 border border-emerald-400/30 backdrop-blur-sm flex items-center space-x-1 text-[11px] font-semibold text-emerald-300">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
<span>Sights</span>
</div>
<!-- Chip 2: Street Eats -->
<div class="px-2.5 py-1 rounded-full bg-amber-950/40 border border-amber-400/30 backdrop-blur-sm flex items-center space-x-1 text-[11px] font-semibold text-amber-300">
<span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
<span>Street Eats</span>
</div>
<!-- Chip 3: Hidden History -->
<div class="px-2.5 py-1 rounded-full bg-purple-950/40 border border-purple-400/30 backdrop-blur-sm flex items-center space-x-1 text-[11px] font-semibold text-purple-300">
<span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
<span>Hidden History</span>
</div>
</div>
<!-- Primary Action & Login Reassurance Link -->
<div class="pt-2 flex flex-col space-y-3">
<!-- CTA Button -->
<button class="w-full py-3.5 px-6 rounded-[18px] bg-gradient-to-r from-brand-coral to-[#ff7377] text-white font-bold text-base shadow-glow-coral hover:shadow-coral-500/80 active:scale-[0.98] transition-all duration-200 flex items-center justify-center space-x-2 group cursor-pointer" data-purpose="primary-action-button" type="button">
<span class="tracking-wide">Let's Explore! ✨</span>
<svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Secondary Link -->
<div class="text-center">
<button class="text-xs text-slate-300/80 hover:text-white transition-colors duration-150 font-medium" type="button">
            Already a scout? <span class="text-brand-teal font-semibold underline decoration-brand-teal/40 underline-offset-4 hover:decoration-brand-teal">Sign In</span>
</button>
</div>
</div>
<!-- Android Home Bar Navigation Pill Indicator -->
<div class="w-full flex justify-center pt-1" data-purpose="android-home-indicator">
<div class="w-28 h-1 bg-white/30 rounded-full"></div>
</div>
</section>
<!-- END: InformationAndActions -->
</main>
<!-- END: PhoneShell -->
</body></html>
