name: VividScout CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Unit Tests, Lint & Firebase Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Set up Node.js 20
        # actions/setup-node v7.1.0 (pinned to major tag v7)
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Grant Execute Permissions for Gradlew
        run: chmod +x gradlew

      - name: Install Functions Test Dependencies
        run: npm --prefix functions ci

      - name: Verify Cloud Function Entry Point Syntax
        run: node --check functions/index.js

      - name: Run Cloud Function Validation Tests
        run: node functions/nearbyPlaces.test.js

      - name: Run Repository Scripts Tests
        run: npm --prefix scripts test

      - name: Cache Firebase Emulator Binaries
        # actions/cache v6.1.0 (pinned to major tag v6)
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-firestore-storage-v1

      - name: Run Firebase Security Rules Emulator Tests
        run: ./functions/node_modules/.bin/firebase emulators:exec --only firestore,storage "npm --prefix functions test"

      - name: Run Android Unit Test Suite
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint Checks
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Audit Functions Dependencies (production only)
        # Fails only on high or critical advisories in production dependencies.
        run: npm --prefix functions audit --omit=dev --audit-level=high

      - name: Run detekt Static Analysis
        # The committed daemon pin (gradle/gradle-daemon-jvm.properties) requires
        # JDK 25, which detekt 1.23.x cannot run on. JDK 21 is provisioned on the
        # runner via the Gradle toolchain; the pin only affects developer machines.
        run: |
          ./gradlew updateDaemonJvm --jvm-version 21
          ./gradlew :app:detekt --stacktrace

  release-validation:
    name: Release Variant Validation (R8, Resource Shrinking, Firebase Config)
    runs-on: ubuntu-latest
    env:
      FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
      SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        # actions/checkout v7.0.1 (pinned to major tag v7)
        uses: actions/checkout@v7

      - name: Set up JDK 25
        # actions/setup-java v6.2.0 (pinned to major tag v6)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant Execute Permissions for Gradlew
        run: chmod +x gradlew

      - name: Require Firebase configuration
        if: ${{ env.FIREBASE_CONFIG == '' }}
        run: |
          echo "::error::Release validation requires the Firebase Android configuration. Provide the FIREBASE_CONFIG secret holding the base64-encoded app/google-services.json of the intended Firebase project; otherwise the release variant's Firebase configuration cannot be validated."
          exit 1

      - name: Provide Firebase Configuration
        if: ${{ env.FIREBASE_CONFIG != '' }}
        run: |
          printf '%s' "$FIREBASE_CONFIG" | base64 -d > app/google-services.json
          test -s app/google-services.json

      - name: Provide Release Keystore
        if: ${{ env.SIGNING_KEYSTORE != '' }}
        run: |
          printf '%s' "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Require Release Signing Credentials
        if: ${{ env.SIGNING_KEYSTORE == '' || env.STORE_PASSWORD == '' || env.KEY_ALIAS == '' || env.KEY_PASSWORD == '' }}
        run: |
          echo "::error::Release variant validation requires release signing credentials. The project gates release packaging on signing by design (see app/build.gradle.kts and README 'Release Signing & Environment Variables'), so an unsigned release build is not a supported validation path. Configure the SIGNING_KEYSTORE (base64 keystore), STORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets to validate the signed release variant."
          exit 1

      - name: Assemble Signed Release APK (R8 + resource shrinking + signing)
        if: ${{ env.SIGNING_KEYSTORE != '' }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Run Lint on Release Variant
        run: ./gradlew :app:lintRelease --stacktrace

      - name: Clean up ephemeral signing material
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/release.keystore" app/google-services.json
