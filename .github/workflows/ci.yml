name: VividScout CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Unit Tests, Lint & Firebase Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Grant Execute Permissions for Gradlew
        run: chmod +x gradlew

      - name: Run Node Cloud Function & Firebase Security Rules Tests
        run: |
          node functions/nearbyPlaces.test.js
          node functions/firebase-security-rules.test.js

      - name: Run Android Unit Test Suite
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint Checks
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble Android Debug APK
        run: ./gradlew assembleDebug --stacktrace
